name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write  # For GHCR

env:
  UV_FROZEN: "1"
  QRL_CHECK_NO_SYNC: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync deps
        run: uv sync --extra dev --extra docs
      - name: Validate with canonical repository gates
        run: ./tools/check full

  docker-build-push:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare image coordinates
        id: image
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="sha-${GITHUB_SHA::12}"
          fi
          {
            echo "runtime_tags<<EOF"
            echo "ghcr.io/${repository}:${version}"
            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              echo "ghcr.io/${repository}:latest"
            fi
            echo "EOF"
            echo "dev_tags<<EOF"
            echo "ghcr.io/${repository}:dev-${version}"
            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              echo "ghcr.io/${repository}:dev-latest"
            fi
            echo "EOF"
            echo "test_tags<<EOF"
            echo "ghcr.io/${repository}:test-${version}"
            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              echo "ghcr.io/${repository}:test-latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push base image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.image.outputs.runtime_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push dev image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: dev
          push: true
          tags: ${{ steps.image.outputs.dev_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push test image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: test
          push: true
          tags: ${{ steps.image.outputs.test_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Optional: PyPI publish (out of scope per decision)
