name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  UV_FROZEN: "1"
  QRL_CHECK_NO_SYNC: "1"

jobs:
  dependency-lock:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.17"
      - run: ./tools/check deps

  security-deps:
    needs: dependency-lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: ./tools/check security-deps

  security-secrets:
    needs: dependency-lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: ./tools/check security-secrets

  quality:
    needs: dependency-lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: ./tools/check quality

  docs:
    needs: dependency-lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev --extra docs
      - run: ./tools/check docs

  architecture:
    needs: dependency-lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: ./tools/check architecture

  graph-quality:
    needs: dependency-lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - name: Install graph analyzer
        run: |
          uv tool install code-review-graph==2.3.9
          uv tool dir --bin >> "$GITHUB_PATH"
      - run: ./tools/check graph-quality

  contracts:
    needs: dependency-lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: ./tools/check contracts

  unit-shards:
    needs: dependency-lock
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: evaluation
            paths: tests/unit/evaluation
          - shard: simulation-config
            paths: tests/unit/simulation tests/unit/configuration
          - shard: features-and-contracts
            paths: tests/unit/features tests/unit/decisioning tests/unit/artifacts tests/unit/research_tools tests/unit/tooling
          - shard: training-data
            paths: tests/unit/training tests/unit/market_data tests/unit/research
          - shard: trading-and-experiments
            paths: tests/unit/trading tests/unit/experiments tests/unit/live
          - shard: compute-and-models
            paths: tests/unit/models tests/unit/compute tests/unit/integrations tests/unit/learning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - name: Run unit shard
        run: QRL_COVERAGE_FILE=.coverage.unit.${{ matrix.shard }} ./tools/check unit-shard ${{ matrix.paths }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qrl-coverage-unit-${{ matrix.shard }}
          path: .coverage.unit.${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: ignore

  unit:
    needs: unit-shards
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every unit shard
        env:
          SHARDS: ${{ needs.unit-shards.result }}
        run: |
          if [[ "$SHARDS" != "success" ]]; then
            echo "Unit test shards did not all pass: $SHARDS" >&2
            exit 1
          fi
          echo "All unit test shards passed"

  build-smoke:
    needs: dependency-lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: ./tools/check build

  integration:
    needs: dependency-lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: QRL_COVERAGE_FILE=.coverage.integration ./tools/check integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qrl-coverage-integration
          path: .coverage.integration*
          include-hidden-files: true
          if-no-files-found: ignore

  coverage-report:
    needs: [unit, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - uses: actions/download-artifact@v4
        with:
          pattern: qrl-coverage-*
          path: coverage-data
          merge-multiple: true
      - run: QRL_COVERAGE_DATA_DIR=coverage-data ./tools/check coverage-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qrl-coverage-report
          path: |
            coverage.xml
            coverage.json
          if-no-files-found: ignore

  advisory-coverage:
    name: advisory / coverage
    needs: coverage-report
    if: always()
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.17"
          enable-cache: true
      - run: uv sync --extra dev
      - uses: actions/download-artifact@v4
        if: ${{ needs.coverage-report.result == 'success' }}
        with:
          name: qrl-coverage-report
          path: ${{ runner.temp }}/advisory-coverage-input
      - name: Reuse required CI coverage evidence
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          COVERAGE_GATE: ${{ needs.coverage-report.result }}
        shell: bash
        run: |
          set +e
          export QRL_PYTHON="$PWD/.venv/bin/python"
          base="$BASE_SHA"
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git merge-base HEAD origin/main) || exit 2
          fi
          failed=0
          ./tools/check local-quality exclusions --base "$base" || failed=1
          if [[ "$COVERAGE_GATE" == success ]]; then
            ./tools/check local-quality coverage-diff "$RUNNER_TEMP/advisory-coverage-input/coverage.json" --full --base "$base" || failed=1
          else
            echo "::warning::Full coverage evidence unavailable because the required coverage gate did not pass"
            failed=1
          fi
          exit "$failed"
      - name: Summarize coverage and exclusions
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as f:
              f.write("## Advisory coverage (reused required CI evidence)\n")
              for p in sorted(Path("outputs/quality-local").glob("*/manifest.json")):
                  data = json.loads(p.read_text())
                  f.write(f"\n- {data['action']}: {data['execution_status']}")
                  result = data.get("result", {})
                  summary = result.get("summary", {}).get("overall", {})
                  for metric in ("line_ratio", "branch_ratio"):
                      if summary.get(metric) is not None:
                          f.write(f"\n  - {metric}: {summary[metric]:.2%}")
                  if isinstance(result.get("findings"), list):
                      f.write(f"\n  - Findings: {len(result['findings'])}")
                  f.write("\n")
          PY

  parity:
    needs: dependency-lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: ./tools/check parity

  training-smoke:
    needs: [integration, parity, build-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: ./tools/check training-smoke

  ci-success:
    if: always()
    needs: [dependency-lock, security-deps, security-secrets, quality, docs, architecture, graph-quality, contracts, unit, build-smoke, integration, coverage-report, parity, training-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require all semantic gates
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          failed = {name: value["result"] for name, value in needs.items() if value["result"] != "success"}
          if failed:
              print(f"Required CI jobs failed or were skipped: {failed}", file=sys.stderr)
              raise SystemExit(1)
          print("All required CI gates passed")
          PY
