name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  UV_FROZEN: "1"
  QRL_CHECK_NO_SYNC: "1"

jobs:
  dependency-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: ./tools/check deps

  security-deps:
    needs: dependency-lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: ./tools/check security-deps

  security-secrets:
    needs: dependency-lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: ./tools/check security-secrets

  quality:
    needs: dependency-lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: ./tools/check quality

  docs:
    needs: dependency-lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev --extra docs
      - run: ./tools/check docs

  architecture:
    needs: dependency-lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: ./tools/check architecture

  graph-quality:
    needs: dependency-lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - name: Install graph analyzer
        run: |
          uv tool install code-review-graph==2.3.9
          uv tool dir --bin >> "$GITHUB_PATH"
      - run: ./tools/check graph-quality

  contracts:
    needs: dependency-lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: ./tools/check contracts

  unit:
    needs: dependency-lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: QRL_COVERAGE_FILE=.coverage.unit ./tools/check unit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qrl-coverage-unit
          path: .coverage.unit*
          include-hidden-files: true
          if-no-files-found: ignore

  build-smoke:
    needs: dependency-lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: ./tools/check build

  integration:
    needs: [architecture, contracts, unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: QRL_COVERAGE_FILE=.coverage.integration ./tools/check integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qrl-coverage-integration
          path: .coverage.integration*
          include-hidden-files: true
          if-no-files-found: ignore

  coverage-report:
    needs: [unit, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - uses: actions/download-artifact@v4
        with:
          pattern: qrl-coverage-*
          path: coverage-data
          merge-multiple: true
      - run: QRL_COVERAGE_DATA_DIR=coverage-data ./tools/check coverage-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qrl-coverage-report
          path: |
            coverage.xml
            coverage.json
          if-no-files-found: ignore

  parity:
    needs: [architecture, contracts, unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: ./tools/check parity

  training-smoke:
    needs: [integration, parity, build-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: ./tools/check training-smoke

  ci-success:
    if: always()
    needs: [dependency-lock, security-deps, security-secrets, quality, docs, architecture, graph-quality, contracts, unit, build-smoke, integration, coverage-report, parity, training-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require all semantic gates
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          failed = {name: value["result"] for name, value in needs.items() if value["result"] != "success"}
          if failed:
              print(f"Required CI jobs failed or were skipped: {failed}", file=sys.stderr)
              raise SystemExit(1)
          print("All required CI gates passed")
          PY
