name: Local quality development validation

on:
  push:
    branches:
      - quality/local-infrastructure-finalization

permissions:
  contents: read

concurrency:
  group: local-quality-development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_FROZEN: "1"
      QRL_CHECK_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.17"
      - run: uv sync --extra dev
      - name: Print scoped formatting fixes
        shell: bash
        run: |
          uv run --no-sync ruff check --fix tools/quality/local_checks tests/unit/tooling/test_local_quality_*.py || true
          uv run --no-sync ruff format tools/quality/local_checks tests/unit/tooling/test_local_quality_*.py
          echo QRL_FORMAT_DIFF_BEGIN
          git diff -- tools/quality/local_checks tests/unit/tooling/test_local_quality_*.py
          echo QRL_FORMAT_DIFF_END
          uv run --no-sync ruff check tools/quality/local_checks tests/unit/tooling/test_local_quality_*.py
      - name: Validate repository ownership catalogs
        run: uv run --no-sync pytest -q tests/unit/research_tools/test_study_catalog.py
      - name: Check scoped types
        if: always()
        run: uv run --no-sync mypy tools/quality/local_checks tests/unit/tooling/test_local_quality_*.py
      - name: Test scoped infrastructure and independent product oracles
        if: always()
        run: uv run --no-sync pytest -q tests/unit/tooling/test_local_quality_*.py
      - name: Exercise local command surface without training
        if: always()
        shell: bash
        run: |
          export QRL_PYTHON="$PWD/.venv/bin/python"
          ./tools/check local-quality --help
          ./tools/check local-quality doctor
          ./tools/check local-quality semantic
          ./tools/check local-quality native
          ./tools/check local-quality environment analyzers plan
          ./tools/check local-quality --timeout 90 coverage --test tests/unit/decisioning/test_candidate_geometry_contract.py --base origin/main
          ./tools/check local-quality --timeout 90 test-shards --path tests/unit/decisioning/test_candidate_geometry_contract.py --count 2 --workers 2
          ./tools/check local-quality dashboard
      - name: Print local result evidence
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path("outputs/quality-local").glob("*/manifest.json")):
              data = json.loads(path.read_text())
              print(data["action"], data["execution_status"])
              if data["execution_status"] not in {"ok", "findings", "not_applicable"}:
                  print(str(data["result"])[:3000])
                  for log in path.parent.glob("*.log*"):
                      print(log.name, log.read_text(errors="replace")[-2500:])
          PY
