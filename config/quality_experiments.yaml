# Controlled learning-quality comparisons.
# Entries are resolved only when a caller explicitly selects a registered ID.
registry_version: 1
development_control: ladder_a3_multi_tp
status: implementation_in_progress
locked_oos_policy: never_select_from_fresh_oos
families:
  - id: account_state
    domain: environment
    control: account_state_baseline
    variants:
      - id: account_state_baseline
        parent: null
        status: control
        overrides:
          env.strategy_actions: true
          env.agent_direction_control: true
          env.allow_agent_sl_mode: true
          env.allow_agent_tp_mode: true
          env.allow_multi_tp: true
          env.allow_simplex: true
          env.entry_state_machine: false
          env.observation_schema_version: account-state-v1
          env.reward_mode: dsr
          agent.arch: tcn
          quality_diagnostics.enabled: true
      - id: account_state_context
        parent: account_state_baseline
        status: implemented_unit_tested
        overrides:
          env.observation_schema_version: account-state-v2
          quality_diagnostics.enabled: true
  - id: rollout_geometry
    domain: learning
    control: account_state_context
    variants:
      - id: rollout_16_envs
        parent: account_state_context
        status: implementation_unverified
        overrides: {env.n_envs: 16, ppo.n_steps: 512}
        resource_contract: {exact_n_envs: true, expected_n_envs: 16, aggregate_rollout_steps: 8192}
      - id: rollout_32_envs
        parent: account_state_context
        status: implementation_unverified
        overrides: {env.n_envs: 32, ppo.n_steps: 256}
        resource_contract: {exact_n_envs: true, expected_n_envs: 32, aggregate_rollout_steps: 8192}
      - id: rollout_64_envs
        parent: account_state_context
        status: implementation_unverified
        overrides: {env.n_envs: 64, ppo.n_steps: 128}
        resource_contract: {exact_n_envs: true, expected_n_envs: 64, aggregate_rollout_steps: 8192}
  - id: reward_objective
    domain: learning
    control: rollout_geometry_winner
    variants:
      - id: reward_risk_500
        parent: rollout_geometry_winner
        status: implementation_unverified
        overrides: {env.reward_mode: rr, env.risk_mode: fixed, env.fixed_risk_usd: 500}
      - id: reward_risk_1000
        parent: rollout_geometry_winner
        status: implementation_unverified
        overrides: {env.reward_mode: rr, env.risk_mode: fixed, env.fixed_risk_usd: 1000}
      - id: reward_equity_delta_r_500
        parent: rollout_geometry_winner
        status: implementation_unverified
        overrides:
          env.reward_mode: equity_delta_r
          env.risk_mode: fixed
          env.fixed_risk_usd: 500
  - id: action_distribution
    domain: learning
    control: reward_objective_winner
    variants:
      - id: semantic_action_heads
        parent: reward_objective_winner
        status: implementation_unverified
        overrides: {ppo.actor_arch: semantic_heads}
      - id: hybrid_action_distribution
        parent: reward_objective_winner
        status: implementation_unverified
        overrides: {ppo.policy_distribution: hybrid_v1}
  - id: risk_constraints
    domain: trading
    control: action_distribution_winner
    variants:
      - id: lagrangian_risk_constraints
        parent: action_distribution_winner
        status: implemented_unit_tested
        overrides: {constrained_rl.enabled: true}
  - id: entry_lifecycle
    domain: environment
    control: risk_constraints_winner
    variants:
      - id: visible_entry_lifecycle
        parent: risk_constraints_winner
        status: implementation_unverified
        overrides: {env.entry_state_machine: true, env.entry_state_observation: true}
      - id: hidden_entry_lifecycle
        parent: risk_constraints_winner
        status: implementation_unverified
        overrides: {env.entry_state_machine: true, env.entry_state_observation: false}
      - id: entry_lifecycle_disabled
        parent: risk_constraints_winner
        status: implementation_unverified
        overrides: {env.entry_state_machine: false}
  - id: encoder_architecture
    domain: representation
    control: entry_lifecycle_winner
    variants:
      - id: lite_tcn_encoder
        parent: entry_lifecycle_winner
        status: existing_encoder_implementation
        overrides: {agent.arch: lite_tcn}
      - id: tcn_encoder_control
        parent: entry_lifecycle_winner
        status: control
        overrides: {agent.arch: tcn}
