# M1-only reference for the candidate-history ablation.
account:
  initial_balance: 100000.0

compute:
  cudnn_benchmark: false

evaluation:
  development_only: true

data:
  timeframes: [M1, M3, M5, M10, M15, M30, H1, H4, D1]

features:
  include_strategy_state: true
  htf_timeframes: [M3, M5, M10, M15, M30, H1, H4, D1]
  entry_ideas:
    enabled: true
    timeframes: [M1]

env:
  n_envs: 8
  strategy_actions: true
  trade_setup_actions: true
  trade_setup_candidate_timeframes: [M1]
  agent_direction_control: false
  reward_mode: survival
  observation_schema_version: account-state-v2
  feature_validity_channels: true
  reachable_r_validity_mask: true
  strict_research_eligibility: true
  max_episode_steps: null

ftmo:
  limit_value_mode: percent_equity
  max_drawdown_mode: static
  risk_per_trade_limit: 1000.0
  risk_sizing_limit_usd: 900.0
  risk_per_trade_limit_pct: 0.01
  daily_loss_limit_pct: 0.05
  soft_daily_loss_limit_pct: 0.05
  max_loss_limit_initial_pct: 0.10
  soft_max_loss_limit_initial_pct: 0.10

trading_policy:
  mode: legacy
  daily_pnl_basis: session_net_equity
  daily_loss_includes_open_pnl: true
  daily_loss_reset_source: supplied_session_id_transition

risk:
  target_timeframes: [M3, M5, M10, M15, M30, H1, H4, D1]

training:
  episode_mode: full_split
  max_days: null
  survival_gate_manifest: null

agent:
  arch: tcn

ppo:
  policy_distribution: trade_setup_hybrid_v1
  actor_arch: shared
  n_steps: 2048
  batch_size: 512
  n_epochs: 15
  learning_rate: 3.0e-4
  gamma: 1.0
  gae_lambda: 1.0
  clip_range: 0.2
  ent_coef: 0.01
  ent_coef_continuous: 0.001
  total_timesteps: 2000000
  checkpoint_freq: 250000

quality_execution:
  requested_n_envs: 8
  exact_n_envs: true
