# Matched local-data replay configuration for the conservative pending-limit
# execution sensitivity. All research-profile settings match
# trade_setup_mtf_reasoning_2m.yaml; only the limit-fill assumption changes.

compute:
  cudnn_benchmark: false

evaluation:
  deterministic: true
  development_only: true

env:
  reward_mode: survival
  n_envs: 8
  strategy_actions: true
  trade_setup_actions: true
  agent_direction_control: false

features:
  include_strategy_state: true
  entry_ideas:
    enabled: true

agent:
  arch: mtf_reasoning

ppo:
  policy_distribution: trade_setup_hybrid_v1
  actor_arch: shared
  n_steps: 2048
  batch_size: 512
  n_epochs: 15
  learning_rate: 3.0e-4
  gamma: 1.0
  gae_lambda: 1.0
  clip_range: 0.2
  ent_coef: 0.01
  ent_coef_continuous: 0.001
  total_timesteps: 2000000
  checkpoint_freq: 250000

quality_execution:
  requested_n_envs: 8
  exact_n_envs: true

execution:
  limit_order_require_trade_through: true
