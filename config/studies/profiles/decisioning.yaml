source_scopes:
  - {path: decisioning/observations.py, study_ids: [decisioning.observation_contract]}
  - {path: decisioning/observation_state.py, study_ids: [decisioning.observation_contract]}
  - {path: decisioning/actions.py, study_ids: [decisioning.action_and_legal_mask_contract]}
  - {path: decisioning/trade_setup.py, study_ids: [decisioning.action_and_legal_mask_contract]}
  - {path: decisioning/adapters, study_ids: [decisioning.provider_adapter_parity]}
  - {path: decisioning/contracts.py, study_ids: [decisioning.provider_adapter_parity]}
  - {path: decisioning/regime_observations.py, study_ids: [decisioning.observation_contract]}
  - {path: decisioning/__init__.py, study_ids: [decisioning.provider_adapter_parity]}
  - {path: research_tools/decisioning, study_ids: [decisioning.observation_contract, decisioning.action_and_legal_mask_contract, decisioning.provider_adapter_parity]}
config_paths: [config/base/default.yaml]
test_paths: [tests/unit/decisioning, tests/unit/evaluation]
studies:
  - id: decisioning.observation_contract
    type: code_check
    question: Do observation fields, ordering, widths, masks, and availability match the declared schema?
    source_paths: [decisioning/observations.py, decisioning/observation_state.py]
    checks: [tests/unit/decisioning/test_observations.py]
    outputs: [observation_contract_check]
  - id: decisioning.action_and_legal_mask_contract
    type: code_check
    question: Are action coordinates, legal choices, decoding, and invalid-action handling consistent across callers?
    source_paths: [decisioning/actions.py]
    checks: [tests/unit/decisioning/test_action_schema_config.py, tests/unit/decisioning/test_trade_setup_contract.py]
    outputs: [action_contract_check]
  - id: decisioning.provider_adapter_parity
    type: code_check
    question: Do rule-based and learned providers return the same typed decision contract without duplicate inference?
    source_paths: [decisioning/contracts.py, decisioning/adapters/sb3.py, decisioning/adapters/rule_based.py]
    checks: [tests/unit/evaluation/test_decision_provider_rollout.py]
    outputs: [provider_contract_check]
