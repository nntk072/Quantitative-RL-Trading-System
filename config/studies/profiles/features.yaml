config_paths: [config/base/default.yaml, config/features/technical_mtf.yaml, config/features/po3_mtf.yaml, config/features/pd_context.yaml, config/features/pd_context_mtf_swing_candidates.yaml, config/features/fvg_ifvg_mtf.yaml, config/features/full_po3_mtf.yaml]
test_paths: [tests/unit/features, tests/research]
studies:
  - id: features.family_schema_and_cache
    type: code_check
    question: Do feature families produce the declared ordered schema and bind all behavior-changing inputs to cache identity?
    source_paths: [features/pipeline/feature_matrix_builder.py, features/pipeline/schema.py, features/pipeline/feature_cache_identity.py]
    checks: [tests/unit/features/test_feature_cache_and_fit_scope.py, tests/unit/features/test_cache_hash_full_column.py]
    outputs: [feature_schema_and_cache_check]
  - id: features.causal_availability
    type: audit
    question: Are feature values available only after their source information is observable, including higher-timeframe close boundaries?
    audit_tool: features.causal_availability
    source_paths: [features/pipeline/feature_build_inputs.py, market_data/transforms/align.py, scripts/research/analysis/features/build_feature_causality_matrix.py, research_tools/studies/handlers/features.py]
    checks: [tests/unit/features/test_htf_alignment.py, tests/research/test_feature_prefix_invariance.py]
    outputs: [feature_causality_matrix, prefix_invariance_results]
  - id: features.fit_scope_and_missing_values
    type: code_check
    question: Are fitted feature states trained only on allowed rows, with warmup, missing, zero, and invalid values distinguished?
    source_paths: [features/pipeline/normalization.py]
    checks: [tests/unit/training/test_feature_fit_scope.py, tests/unit/features/test_feature_cache_and_fit_scope.py]
    outputs: [fit_scope_and_validity_check]
  - id: features.context_candidates_and_session_masks
    type: code_check
    question: Do context, structure, candidate identity, expiry, and session eligibility preserve their declared timing and mask semantics?
    source_paths: [features/context/reachability.py, features/context/liquidity.py, features/pipeline/session_stage.py, features/pipeline/structure_stage.py]
    checks: [tests/unit/features/test_causal_features.py, tests/unit/features/test_session_filter.py]
    outputs: [context_candidate_and_session_check]
  - id: features.prefix_causality_and_fit_scope
    type: audit
    question: Do feature and model inputs remain unchanged when recomputed from only the history available at each decision time, with fitted state learned from training rows only?
    acceptance: Every registered feature family passes prefix-invariance and higher-timeframe close-availability checks; fitted state uses training rows only, later periods reuse that state, and any mismatch blocks dependent selection.
    audit_tool: features.prefix_causality
    config_paths: [config/base/default.yaml, config/research/prospective_research_protocol.yaml, config/research/representation_study.yaml]
    source_paths: [features/pipeline/feature_build_inputs.py, features/pipeline/normalization.py, scripts/research/analysis/features/build_feature_causality_matrix.py, research_tools/studies/handlers/features.py]
    checks: [tests/research/test_feature_prefix_invariance.py, tests/research/test_feature_causality_matrix.py]
    outputs: [prefix_invariance_report, feature_availability_report, train_fit_scope_report]
  - id: features.candidate_geometry_and_proposal_preflight
    type: audit
    question: Do training candidates have valid declared geometry and a source-identified proposal preflight with explicit quote availability and refusal counts?
    acceptance: Geometry-support and proposal counts reconcile to hash-bound training inputs and config; unavailable geometry, quote gaps, and proposal refusals remain explicit; outcome replay, censoring acceptance, and policy value remain unclaimed.
    audit_tool: features.candidate_geometry_support
    source_paths: [features/context/reachability.py, evaluation/candidate_proposals.py, evaluation/candidate_outcomes.py, evaluation/candidate_quote_coverage.py, scripts/research/analysis/features/candidate_geometry_support.py, research_tools/features/evaluation/build_candidate_proposal_ledger.py, research_tools/studies/handlers/features.py]
    config_paths: [config/research/trade_setup_mtf_reasoning_2m.yaml, config/research/prospective_research_protocol.yaml]
    checks: [tests/research/test_candidate_geometry_support.py, tests/unit/evaluation/test_candidate_quote_coverage.py]
    outputs: [candidate_geometry_support_report, candidate_proposal_coverage_counts, proposal_outcome_replay_unrun]
  - id: features.technical_indicators_window_and_units
    type: code_check
    question: Do indicator windows, warmup rows, units, and session-reset rules match their declared inputs?
    source_paths: [features/technical/indicators.py]
    checks: [tests/unit/features/test_causal_features.py, tests/unit/features/test_build_pipeline.py]
    outputs: [indicator_window_and_unit_check]
  - id: features.confirmed_swings_and_structure
    type: code_check
    question: Are pivots, swings, and structure labels emitted only after the confirming observations are available?
    source_paths: [features/technical/swings.py, features/technical/structure.py]
    checks: [tests/unit/features/test_pivots_swings.py, tests/unit/features/test_structure.py]
    outputs: [swing_confirmation_and_structure_check]
  - id: features.higher_timeframe_sweep_confirmation
    type: code_check
    question: Do higher-timeframe sweeps retain their source-close time and avoid appearing before confirmation?
    source_paths: [features/technical/htf_sweeps.py]
    checks: [tests/unit/features/test_htf_sweeps.py, tests/unit/features/test_htf_alignment.py]
    outputs: [higher_timeframe_sweep_check]
  - id: features.liquidity_sweep_events
    type: code_check
    question: Are liquidity sweep levels, event identities, and retained-versus-consumed outcomes stable at equal timestamps and repeated touches?
    source_paths: [features/context/liquidity.py]
    checks: [tests/unit/features/test_liquidity.py, tests/research/test_ifvg_zone_event_ledger.py]
    outputs: [liquidity_sweep_event_check]
  - id: features.order_block_event_identity
    type: code_check
    question: Do order-block zones preserve their originating event, invalidation rule, and lifecycle across overlapping candidates?
    source_paths: [features/context/order_blocks.py]
    checks: [tests/unit/features/test_order_blocks.py, tests/research/test_order_block_zone_event_ledger.py]
    outputs: [order_block_identity_and_lifecycle_check]
  - id: features.premium_discount_boundaries
    type: code_check
    question: Are premium, discount, equilibrium, and prior-range values computed from the intended completed interval?
    source_paths: [features/context/premium_discount.py]
    checks: [tests/unit/features/test_pd_context.py, tests/unit/features/test_session_tz_pd.py]
    outputs: [premium_discount_interval_check]
  - id: features.session_level_rollovers
    type: code_check
    question: Do session levels use the configured timezone, completed session bars, and correct daylight-saving and rollover boundaries?
    source_paths: [features/context/session_levels.py]
    checks: [tests/unit/features/test_session_levels.py, tests/unit/features/test_session_ohlc.py, tests/unit/features/test_session_tz_pd.py]
    outputs: [session_level_rollover_check]
  - id: features.smt_symbol_time_alignment
    type: code_check
    question: Are SMT comparisons aligned by observed timestamp and common source interval without forward leakage or silent missing-symbol substitution?
    source_paths: [features/context/smt.py]
    checks: [tests/unit/features/test_smt.py, tests/unit/features/test_causal_features.py]
    outputs: [smt_alignment_and_missing_symbol_check]
  - id: features.entry_idea_eligibility_and_expiry
    type: code_check
    question: Do entry ideas retain stable identity and apply eligibility, expiry, and duplicate-event rules at the decision time?
    source_paths: [features/context/entry_ideas.py, features/context/trade_setup_candidates.py]
    checks: [tests/unit/features/test_entry_ideas.py, tests/unit/features/test_trade_setup_candidate_events.py, tests/unit/features/test_trade_setup_event_validity.py]
    outputs: [entry_idea_eligibility_and_expiry_check]
  - id: features.reachability_and_target_geometry
    type: code_check
    question: Are reachable-R and target-distance values bounded by executable prices and explicit label-window availability?
    source_paths: [features/context/reachability.py, features/context/trade_setup_candidates.py]
    checks: [tests/unit/features/test_trade_setup_event_validity.py, tests/research/test_candidate_geometry_support.py]
    outputs: [reachability_and_target_geometry_check]
  - id: features.fvg_ifvg_event_lifecycle
    type: code_check
    question: Do FVG and IFVG events preserve source timeframe, confirmation time, collision policy, and invalidation transitions?
    source_paths: [features/po3/fvg_detection.py, features/po3/ifvg_detection.py, features/po3/ifvg_state.py, features/po3/zones.py]
    checks: [tests/unit/features/test_po3_ifvg_state.py, tests/research/test_fvg_timeframe_event_ledger.py, tests/research/test_ifvg_timeframe_collision_ledger.py]
    outputs: [fvg_ifvg_event_lifecycle_check]
  - id: features.po3_setup_state_transitions
    type: code_check
    question: Do PO3 phase and entry-trigger transitions preserve ordering, reset conditions, and the originating setup identity?
    source_paths: [features/po3/po3_phase_state.py, features/po3/trigger_rules.py, features/pipeline/po3_stage.py]
    checks: [tests/unit/features/test_po3_state.py, tests/unit/features/test_po3_setup_lifecycle.py, tests/research/test_po3_setup_lifecycle_ledger.py]
    outputs: [po3_setup_transition_check]
