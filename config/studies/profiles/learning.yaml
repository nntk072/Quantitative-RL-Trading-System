  - {path: learning/self_supervised, study_ids: [learning.auxiliary_target_isolation]}
  - {path: learning/contracts.py, study_ids: [learning.seed_resume_and_fit_identity, learning.auxiliary_target_isolation]}
  - {path: learning/learner_factory.py, study_ids: [learning.seed_resume_and_fit_identity]}
  - {path: learning/__init__.py, study_ids: [learning.seed_resume_and_fit_identity]}
  - {path: research_tools/learning, study_ids: [learning.ppo_action_probability_contract, learning.sac_action_replay_and_budget, learning.seed_resume_and_fit_identity, learning.auxiliary_target_isolation]}
config_paths: [config/base/default.yaml, config/variant_catalog.yaml, config/quality_experiments.yaml]
test_paths: [tests/unit/learning, tests/unit/training]
studies:
  - id: learning.ppo_action_probability_contract
    type: code_check
    question: Do PPO samples, stored action probabilities, entropy, returns, and updates use matching action semantics?
    source_paths: [learning/rl/ppo.py, learning/rl/hybrid.py, learning/rl/rollout_buffer.py]
    checks: [tests/unit/training/test_training_smoke.py, tests/unit/models/test_ppo_log_std.py, tests/unit/learning/test_hybrid_runtime_remaining_contracts.py]
    outputs: [ppo_contract_check]
  - id: learning.sac_action_replay_and_budget
    type: code_check
    question: Are SAC action bounds, replay samples, update counts, and training budgets explicit and reproducible?
    source_paths: [learning/rl/agent.py, learning/rl/learner.py]
    checks: [tests/unit/training/test_sac_smoke.py, tests/unit/training/test_fit_request.py]
    outputs: [sac_contract_check]
  - id: learning.agent_factory_and_action_schema
    type: code_check
    question: Does agent construction fail clearly when required runtime components are unavailable, and bind categorical schema to the model action width?
    source_paths: [learning/rl/agent.py]
    checks: [tests/unit/learning/test_rl_agent_additional_runtime_contracts.py]
    outputs: [agent_factory_and_schema_check]
  - id: learning.seed_resume_and_fit_identity
    type: code_check
    question: Do seeds, devices, fit requests, checkpoints, and resumed optimizer state retain one learning identity?
    source_paths: [learning/contracts.py, learning/learner_factory.py, learning/rl/checkpoint.py, learning/rl/learner.py]
    checks: [tests/unit/training/test_seed_reproducibility.py, tests/unit/training/test_save_checkpoint.py]
    outputs: [learning_reproducibility_check]
  - id: learning.auxiliary_target_isolation
    type: code_check
    question: Are auxiliary targets and supervised reference objectives restricted to their declared training information?
    source_paths: [learning/rl/auxiliary.py, learning/supervised/reference.py]
    checks: [tests/unit/training/test_auxiliary_training.py, tests/unit/training/test_feature_fit_scope.py]
    outputs: [auxiliary_fit_scope_check]
