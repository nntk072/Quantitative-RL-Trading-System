config_paths: [config/base/default.yaml]
test_paths: [tests/unit/simulation]
studies:
  - id: simulation.transition_and_episode_contract
    type: code_check
    question: Do action, observation, account, reward, episode, truncation, and breach transitions follow one explicit order?
    source_paths: [simulation/environment/env.py, simulation/contracts/transition.py, simulation/environment/step_runtime.py, simulation/environment/step_end_runtime.py]
    checks: [tests/unit/simulation/test_environment/test_simulation_transition_contract.py, tests/unit/simulation/test_environment/test_trading_env_golden_traces.py]
    outputs: [transition_and_episode_check]
  - id: simulation.tick_fills_and_protective_orders
    type: code_check
    question: Do tick fills resolve executable quotes, intrabar crossings, stop-target collisions, and missing-tick behavior as configured?
    source_paths: [simulation/environment/tick_quote_runtime.py, simulation/environment/fill_quote_runtime.py, simulation/environment/protective_level_runtime.py]
    checks: [tests/unit/simulation/test_environment/test_tick_fill_reconciliation.py, tests/unit/simulation/test_environment/test_sl_tp_fill.py, tests/unit/simulation/test_environment/test_tp_execution.py]
    outputs: [tick_execution_check]
  - id: simulation.accounting_reward_and_telemetry
    type: code_check
    question: Do realized PnL, reward attribution, guardrail state, and transition telemetry reconstruct from the same events?
    source_paths: [simulation/environment/step_accounting_runtime.py, simulation/environment/trade_accounting_runtime.py, simulation/environment/step_info_runtime.py]
    checks: [tests/unit/simulation/test_reward.py, tests/unit/simulation/test_environment/test_sweep_reward.py, tests/unit/simulation/test_environment/test_account_normalization.py]
    outputs: [accounting_reward_and_telemetry_check]
  - id: simulation.backtest_and_cross_validation_parity
    type: code_check
    question: Do event replay, fold boundaries, account state, and fill records agree between backtest and evaluation paths?
    source_paths: [simulation/backtest/event_driven_backtest.py, simulation/backtest/accounting.py, simulation/backtest/cross_validation/backtrader_runner.py]
    checks: [tests/integration/backtest/test_engine_cross_validation.py, tests/integration/backtest/test_engine_execution_contract.py]
    outputs: [backtest_parity_check]
  - id: simulation.tick_execution_accounting_parity
    type: audit
    question: On shared tick and quote inputs, do environment and event-backtest decisions, fills, costs, account balances, risk state, and terminal outcomes reconcile?
    acceptance: Inputs and decision cohorts match; tick-derived execution records reconcile through account state, and every remaining difference has a source-backed disposition; unresolved fill, quote, or breach-state differences block dependent policy claims.
    audit_tool: simulation.tick_execution_accounting_parity
    config_paths: [config/base/default.yaml, config/research/prospective_research_protocol.yaml]
    source_paths: [simulation/environment, simulation/backtest/event_driven_backtest.py, evaluation/reporting/account_state_trace_reconciliation.py, research_tools/studies/handlers/simulation.py]
    checks: [tests/integration/backtest/test_account_transition_parity.py, tests/integration/backtest/test_local_tick_action_trace.py, tests/unit/evaluation/test_account_state_trace_reconciliation.py]
    outputs: [matched_decision_and_fill_ledger, account_state_reconciliation, discrepancy_register]
    prerequisites: [market_data.raw_data_quality_and_coverage, features.prefix_causality_and_fit_scope]
  - id: simulation.bar_decisions_with_tick_fills
    type: code_check
    question: Can a policy decide on completed bars while every entry and protective fill is resolved from source-ordered ticks available after that decision?
    source_paths: [simulation/environment/market_access.py, simulation/environment/tick_quote_runtime.py, simulation/environment/step_action_execution.py]
    checks: [tests/integration/backtest/test_local_tick_action_trace.py, tests/unit/simulation/test_environment/test_tick_fill_reconciliation.py]
    outputs: [bar_decision_tick_fill_contract_check]
  - id: simulation.protective_order_priority_and_ties
    type: code_check
    question: When stop, target, and terminal events are reachable in one interval, is the fill chosen by the declared source-order and tie policy?
    source_paths: [simulation/backtest/protective_events.py, simulation/environment/protective_level_runtime.py, simulation/environment/fill_quote_runtime.py]
    checks: [tests/unit/simulation/test_environment/test_sl_tp_fill.py, tests/integration/backtest/test_multi_target_protective_lifecycle.py, tests/unit/simulation/test_environment/test_take_profit_level_ordering.py]
    outputs: [protective_order_priority_and_tie_check]
  - id: simulation.limit_entry_price_bound_and_expiry
    type: code_check
    question: Do limit entries respect their submitted price bound, expiry, fill delay, and equal-touch versus trade-through configuration?
    source_paths: [simulation/environment/entry_order_runtime.py, simulation/environment/entry_execution_runtime.py, trading/orders/entry_execution.py]
    checks: [tests/unit/simulation/test_environment/test_entry_state_machine.py, tests/integration/backtest/test_agent_selected_entry_execution.py, tests/unit/trading/test_entry_execution_orders.py]
    outputs: [limit_entry_bound_and_expiry_check]
  - id: simulation.accounting_reward_and_cost_attribution
    type: code_check
    question: Do fill cashflows, realized equity, reward values, and cost telemetry reconcile exactly once for open, partial, closed, and rejected positions?
    source_paths: [simulation/environment/step_accounting_runtime.py, simulation/environment/trade_accounting_runtime.py, simulation/environment/rewards.py, simulation/backtest/accounting.py]
    checks: [tests/unit/simulation/test_environment/test_equity_delta_reward.py, tests/unit/simulation/test_reward.py, tests/unit/evaluation/test_reward_attribution.py, tests/integration/backtest/test_broker_fill_accounting.py]
    outputs: [accounting_reward_and_cost_attribution_check]
  - id: simulation.episode_end_and_session_liquidation
    type: code_check
    question: Are termination, truncation, session close, forced liquidation, and overnight blocking distinguishable and applied at the configured boundary?
    source_paths: [simulation/environment/episode_runtime.py, simulation/environment/step_end_runtime.py, simulation/backtest/event_driven_backtest.py]
    checks: [tests/unit/simulation/test_environment/test_ny_steps_eod.py, tests/unit/simulation/test_environment/test_year_episode_survival.py, tests/integration/backtest/test_engine_execution_contract.py]
    outputs: [episode_end_and_session_liquidation_check]
  - id: simulation.vectorized_environment_parity
    type: code_check
    question: Do scalar, worker, and shared-bundle execution produce equivalent observations, transitions, fills, and terminal states for the same seed and input?
    source_paths: [simulation/environment/bundles.py, simulation/environment/shared_bundle.py, simulation/environment/worker.py]
    checks: [tests/unit/simulation/test_environment/test_bundle_env_equivalence.py, tests/unit/simulation/test_environment/test_bundle_worker.py, tests/unit/simulation/test_environment/test_shared_bundle.py]
    outputs: [vectorized_environment_parity_check]
  - id: simulation.backtest_engine_and_fold_parity
    type: code_check
    question: Do the event-driven and cross-validation backtest paths preserve the same policy actions, account transitions, and fold boundaries?
    source_paths: [simulation/backtest/event_driven_backtest.py, simulation/backtest/cross_validation/run.py, simulation/backtest/cross_validation/backtrader_runner.py]
    checks: [tests/integration/backtest/test_engine_backtrader_signal_parity.py, tests/integration/backtest/test_engine_cross_validation.py, tests/integration/backtest/test_account_transition_parity.py]
    outputs: [backtest_engine_and_fold_parity_check]
