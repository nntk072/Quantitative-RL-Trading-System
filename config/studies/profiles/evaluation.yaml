test_paths: [tests/unit/evaluation, tests/integration/evaluation]
studies:
  - id: evaluation.metrics_and_inference
    type: code_check
    question: Are metric sources, estimands, pairing, uncertainty, multiplicity, and valid outcome states explicit?
    source_paths: [evaluation/metrics/performance.py, evaluation/metrics/matched_comparison.py, evaluation/metrics/bootstrap.py]
    checks: [tests/unit/evaluation/test_metrics.py, tests/unit/evaluation/test_matched_comparison.py]
    outputs: [metric_and_inference_check]
  - id: evaluation.cohorts_and_baseline_matching
    type: code_check
    question: Do baselines and treatments use the same timestamps, candidate cohort, execution model, and account limits?
    source_paths: [evaluation/rollout/episode_rollout.py, evaluation/rollout/trained_policy_rollout.py]
    checks: [tests/unit/evaluation/test_rollout.py, tests/unit/evaluation/test_baseline_eval_strategy_catalog.py]
    outputs: [cohort_and_baseline_check]
  - id: evaluation.provenance_and_checkpoint_reanalysis
    type: code_check
    question: Can results be rebuilt from immutable run identity, saved config, source data, checkpoint, and evaluation inputs?
    source_paths: [evaluation/reporting/run_manifest.py, evaluation/reporting/evaluation_manifest.py, evaluation/reanalysis/checkpoint_reanalysis.py]
    checks: [tests/unit/evaluation/test_run_manifest.py, tests/unit/evaluation/test_evaluation_manifest.py]
    outputs: [evaluation_provenance_check]
  - id: evaluation.reporting_and_exports
    type: code_check
    question: Do tables, trade exports, plots, and outcome labels derive from verified result artifacts and preserve missing evidence?
    source_paths: [evaluation/reporting/run_artifact_writer.py, evaluation/reporting/trade_event_export.py, evaluation/reporting/box_table.py]
    checks: [tests/unit/evaluation/test_run_artifact_writer_limits.py, tests/unit/evaluation/test_evaluation_report_dataset.py]
    outputs: [report_and_export_check]
  - id: evaluation.candidate_geometry_value
    type: empirical
    question: After candidate proposal, outcome, censoring, quote-coverage, and purge contracts pass, does explicit price geometry add decision value beyond the existing setup-class representation?
    acceptance: Candidate proposals and outcomes are causal, censoring and local quote gaps remain explicit, and the matched control and treatment complete the registered paths; any positive claim requires a pre-outcome multiplicity rule and a paired interval whose lower bound exceeds zero, otherwise report no demonstrated value.
    source_paths: [evaluation/candidate_proposals.py, evaluation/candidate_outcomes.py, evaluation/candidate_quote_coverage.py, scripts/research/analysis/features/candidate_geometry_support.py, scripts/research/analysis/evidence/analyze_paired_seed_results.py]
    checks: [tests/research/test_candidate_geometry_support.py, tests/research/test_candidate_event_cardinality_register.py, tests/unit/evaluation/test_rollout.py]
    outputs: [candidate_support_and_coverage, proposal_outcome_censoring_ledger, matched_geometry_comparison]
    prerequisites: [market_data.raw_data_quality_and_coverage, features.prefix_causality_and_fit_scope, simulation.tick_execution_accounting_parity, training.full_path_survival_qualification]
    claim_role: exploratory_secondary
    replication: {seeds: [42, 43, 44, 45, 46, 47], minimum_valid_pairs: 6}
    arms:
      - id: setup_class_control
        config_paths: [config/base/default.yaml, config/research/prospective_research_protocol.yaml, config/research/survival_trade_setup_mtf_conditioned.yaml]
        factors: [policy_distribution=trade_setup_conditioned_v1, candidate_geometry_actions=false]
      - id: candidate_geometry_treatment
        config_paths: [config/base/default.yaml, config/research/prospective_research_protocol.yaml, config/research/survival_trade_setup_candidate_geometry.yaml]
        factors: [policy_distribution=trade_setup_candidate_geometry_v1, candidate_geometry_actions=true]
  - id: evaluation.primary_value_vs_no_trade
    type: empirical
    question: After survival qualification, does the frozen treatment improve development full-path net return on initial operating equity over always-no-trade?
    acceptance: Every treatment path passes the hard-risk gate, the one-sided paired sign-flip test rejects at alpha 0.05, and the paired 95 percent bootstrap lower bound exceeds zero; otherwise no policy has demonstrated economic superiority.
    source_paths: [evaluation/metrics/matched_comparison.py, scripts/research/analysis/evidence/build_primary_paired_seed_payload.py, scripts/research/analysis/evidence/analyze_paired_seed_results.py]
    checks: [tests/unit/evaluation/test_matched_comparison.py, tests/unit/evaluation/test_account_state_trace_reconciliation.py, tests/unit/research/test_primary_paired_seed_payload.py, tests/unit/research/test_paired_seed_statistics.py]
    outputs: [six_seed_matched_pair_payload, survival_gate, sign_flip_result, paired_bootstrap_interval]
    prerequisites: [training.full_path_survival_qualification]
    replication: {seeds: [42, 43, 44, 45, 46, 47], minimum_valid_pairs: 6}
    periods: {selection: development, exposed_report_period_selectable: false}
    inference: {primary_unit: independent_seed_pair, alternative: greater, alpha: 0.05, bootstrap_samples: 10000, rng_seed: 42}
    arms:
      - id: always_no_trade_control
        policy_id: always_no_trade_v1
        config_paths: [config/base/default.yaml, config/research/prospective_research_protocol.yaml]
        factors: [policy=always_no_trade_v1, zero_trades, retain_initial_operating_equity]
      - id: qualified_policy_treatment
        policy_id: qualified_setup_conditioned_policy
        config_paths: [config/base/default.yaml, config/research/prospective_research_protocol.yaml, config/research/survival_trade_setup_mtf_conditioned.yaml]
        factors: [policy=survival_qualified_checkpoint, development_only, matched_seed_pairs]
  - id: evaluation.secondary_matched_comparisons
    type: empirical
    question: How do the registered random, deterministic-rule, and completed-HTF representation controls compare on the same development cohort after qualification gates pass?
    acceptance: All registered pairs use the same source, split, decision cohort, execution, risk, cost, and seed identity; report every attempted result and uncertainty, retain this comparison as exploratory unless a multiplicity procedure was frozen before outcomes, and make no claim from the exposed report period.
    source_paths: [evaluation/metrics/matched_comparison.py, evaluation/rollout/trained_policy_rollout.py, scripts/research/analysis/evidence/build_representation_paired_seed_payload.py, scripts/research/analysis/evidence/analyze_representation_paired_seed_results.py]
    checks: [tests/unit/evaluation/test_matched_comparison.py, tests/unit/evaluation/test_rollout.py, tests/unit/research/test_representation_paired_seed_payload.py]
    outputs: [matched_secondary_pair_ledgers, uncertainty_and_multiplicity_disposition]
    prerequisites: [training.full_path_survival_qualification]
    claim_role: exploratory_secondary
    replication: {seeds: [42, 43, 44, 45, 46, 47], minimum_valid_pairs: 6}
    arms:
      - id: random_eligible_setup_control
        policy_id: random_eligible_trade_setup_v1
        config_paths: [config/base/default.yaml, config/research/prospective_research_protocol.yaml, config/research/survival_trade_setup_mtf_conditioned.yaml]
        factors: [policy=random_eligible_trade_setup_v1, seed_matched, same_eligible_setup_mask]
      - id: deterministic_structure_rule_control
        policy_id: structure_priority
        config_paths: [config/base/default.yaml, config/research/prospective_research_protocol.yaml, config/research/survival_trade_setup_mtf_conditioned.yaml]
        factors: [policy=structure_priority, fixed_rule_order, same_decision_contract]
      - id: masked_history_control_b
        config_paths: [config/base/default.yaml, config/research/prospective_research_protocol.yaml, config/research/representation_study.yaml, config/research/mtf_shared_opportunities_m1_history.yaml]
        factors: [representation=masked_history, arm=B]
      - id: completed_htf_treatment_c
        config_paths: [config/base/default.yaml, config/research/prospective_research_protocol.yaml, config/research/representation_study.yaml, config/research/mtf_shared_opportunities_with_history.yaml]
        factors: [representation=completed_htf, arm=C]
    unregistered_controls: {supervised_reference: must_be_registered_before_use}
