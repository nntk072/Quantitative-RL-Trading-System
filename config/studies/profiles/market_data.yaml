studies:
- id: market_data.source_parsing_and_quality
  type: code_check
  question: Are bar and tick rows parsed with explicit schemas and quality denominators?
  source_paths:
  - market_data/loading/bars.py
  - market_data/loading/ticks.py
  - market_data/quality_audit.py
  checks:
  - tests/integration/test_loader.py
  - tests/unit/market_data/test_ticks.py
  outputs:
  - source_schema_and_quality_check
- id: market_data.cache_identity_and_rebuild
  type: code_check
  question: Do bar and tick caches bind parsed content and semantic settings to their identity?
  source_paths:
  - market_data/cache/bars.py
  - market_data/cache/ticks.py
  - market_data/loading/market_data_ingestion.py
  checks:
  - tests/integration/test_bar_cache_manifest.py
  - tests/integration/test_pipeline_splits.py
  outputs:
  - cache_identity_check
- id: market_data.time_sessions_and_timeframes
  type: code_check
  question: Are timezone, session calendar, resampling, and completed higher-timeframe alignment consistent?
  source_paths:
  - market_data/transforms/sessions.py
  - market_data/transforms/session_schedule.py
  - market_data/transforms/resample.py
  - market_data/transforms/align.py
  checks:
  - tests/unit/market_data/test_session_schedule.py
  - tests/integration/test_resample_m10.py
  - tests/unit/features/test_htf_alignment.py
  outputs:
  - time_and_alignment_check
- id: market_data.chronological_splits
  type: code_check
  question: Do date splits and walk-forward folds enforce chronology, purge, embargo, and non-overlap?
  source_paths:
  - market_data/splits/definitions.py
  - market_data/splits/walkforward.py
  checks:
  - tests/unit/market_data/test_walkforward.py
  outputs:
  - split_contract_check
- id: market_data.raw_data_quality_and_coverage
  type: audit
  question: Do the current canonical bar and tick sources meet registered parsing, chronology, missingness, and quote-denominator requirements?
  acceptance: Every canonical source is hash-bound and represented in the audit; row, interval, invalid-value, and quote-coverage denominators reconcile, and every breach or unresolved interval remains explicit as a no-go for dependent claims.
  audit_tool: market_data.raw_data_quality
  config_paths:
  - config/base/default.yaml
  - evidence/research/data_identity/raw_data_manifest.json
  - evidence/research/data_identity/raw_source_inventory.json
  source_paths:
  - market_data/quality_audit.py
  - scripts/research/analysis/market_data/scan_local_market_data_quality.py
  - scripts/research/analysis/market_data/audit_tick_quote_coverage.py
  - research_tools/studies/handlers/market_data.py
  checks:
  - tests/unit/market_data/test_quality_audit.py
  - tests/research/test_quote_quality_scans.py
  outputs:
  - source_quality_report
  - tick_quote_coverage_report
  - unresolved_interval_register
- id: market_data.bar_ingestion_and_row_validity
  type: code_check
  question: Do bar loaders preserve source identity, timestamp order, duplicate handling, and invalid OHLC dispositions?
  source_paths:
  - market_data/loading/bars.py
  - market_data/loading/market_data_ingestion.py
  - market_data/transforms/cleaning.py
  checks:
  - tests/integration/test_loader.py
  - tests/unit/market_data/test_quality_audit.py
  outputs:
  - bar_ingestion_and_row_validity_check
- id: market_data.tick_order_and_book_reconstruction
  type: code_check
  question: Are tick timestamps ordered and bid/ask books reconstructed with explicit equal-time and carried-quote rules?
  source_paths:
  - market_data/loading/ticks.py
  - market_data/loading/tick_book_pipeline.py
  checks:
  - tests/unit/market_data/test_ticks.py
  - tests/integration/backtest/test_local_tick_action_trace.py
  outputs:
  - tick_order_and_book_reconstruction_check
- id: market_data.tick_coverage_and_quote_age
  type: audit
  question: Which decision and fill intervals lack local quote coverage or rely on carried quotes beyond the declared age limit?
  acceptance: Source files and intervals are counted against registered denominators; missing, stale, and unavailable quotes remain separate outcomes. If carried-side age is not measured, the audit marks dependent fill claims blocked and does not treat minute coverage as age evidence.
  audit_tool: market_data.tick_coverage_and_quote_age
  source_paths:
  - market_data/loading/tick_book_pipeline.py
  - research_tools/market_data/market_data/audit_tick_quote_coverage.py
  - research_tools/market_data/market_data/audit_tickbook_carry_forward.py
  - research_tools/studies/handlers/market_data.py
  config_paths:
  - config/base/default.yaml
  - config/research/research_output_contract.yaml
  checks:
  - tests/research/test_quote_quality_scans.py
  - tests/research/test_fill_quote_source_alignment.py
  outputs:
  - tick_interval_coverage_counts
  - quote_age_distribution
  - uncovered_interval_dispositions
- id: market_data.timeframe_resampling_and_close_alignment
  type: code_check
  question: Do resampled bars retain the configured source interval and become visible only at their actual close time?
  source_paths:
  - market_data/transforms/align.py
  - market_data/transforms/resample.py
  checks:
  - tests/research/test_configured_timeframe_parity.py
  - tests/unit/features/test_htf_alignment.py
  outputs:
  - timeframe_close_and_resampling_check
- id: market_data.session_timezone_and_schedule_boundaries
  type: code_check
  question: Do session labels and scheduled closes handle timezone conversion, daylight-saving transitions, holidays, and session gaps consistently?
  source_paths:
  - market_data/transforms/session_schedule.py
  - market_data/transforms/sessions.py
  checks:
  - tests/unit/market_data/test_session_schedule.py
  - tests/unit/features/test_session_tz_pd.py
  outputs:
  - session_timezone_and_schedule_check
- id: market_data.price_grid_and_tick_size
  type: code_check
  question: Are bars and quotes quantized to the configured instrument price grid without changing source identity or trade direction?
  source_paths:
  - market_data/transforms/price_grid.py
  checks:
  - tests/integration/test_price_grid.py
  - tests/unit/market_data/test_ticks.py
  outputs:
  - price_grid_and_tick_size_check
- id: market_data.symbol_discovery_and_source_selection
  type: code_check
  question: Does symbol discovery and source selection produce a reproducible instrument set with explicit exclusions?
  source_paths:
  - market_data/commands/discover.py
  - market_data/contracts.py
  checks:
  - tests/unit/market_data/test_dataset_source_contract.py
  outputs:
  - symbol_discovery_and_source_selection_check
