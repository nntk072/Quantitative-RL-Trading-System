source_scopes:
  - {path: configuration/schema.py, study_ids: [configuration.schema_and_domain_validation]}
  - {path: configuration/configuration_loader.py, study_ids: [configuration.schema_and_domain_validation, configuration.merge_precedence_and_overrides]}
  - {path: configuration/hashing.py, study_ids: [configuration.resolved_identity]}
  - {path: configuration/paths.py, study_ids: [configuration.merge_precedence_and_overrides]}
  - {path: configuration/__init__.py, study_ids: [configuration.schema_and_domain_validation, configuration.resolved_identity]}
config_paths: [config/base/default.yaml]
test_paths: [tests/unit/configuration]
studies:
  - id: configuration.schema_and_domain_validation
    type: code_check
    question: Are every configured setting and domain value recognized and validated before use?
    source_paths: [configuration/schema.py, configuration/configuration_loader.py]
    checks: [tests/unit/configuration/test_config_typo_safety.py]
    outputs: [configuration_validation_check]
  - id: configuration.merge_precedence_and_overrides
    type: code_check
    question: Do defaults, overlays, and CLI overrides resolve in one documented order without admitting unknown keys?
    source_paths: [configuration/configuration_loader.py]
    checks: [tests/unit/configuration/test_config_typo_safety.py]
    outputs: [configuration_resolution_check]
  - id: configuration.resolved_identity
    type: code_check
    question: Does canonical hashing give equal effective configs equal identities and changed settings new identities?
    source_paths: [configuration/hashing.py]
    checks: [tests/unit/configuration/test_configuration_helpers.py]
    outputs: [configuration_identity_check]
