source_scopes:
  - {path: integrations/mt5, study_ids: [integrations.broker_contract_conversion, integrations.symbol_and_order_constraints]}
  - {path: integrations/__init__.py, study_ids: [integrations.broker_contract_conversion]}
config_paths: [config/base/default.yaml]
test_paths: [tests/unit/integrations/test_mt5_connection.py, tests/unit/integrations/test_mt5_data_source.py, tests/unit/integrations/test_mt5_robot_paper_cycle.py, tests/unit/integrations/test_mt5_risk_manager_edges.py, tests/unit/integrations/test_mt5_trader_management.py, tests/unit/integrations/test_multi_symbol_robot_status.py, tests/unit/integrations/test_multi_symbol_trading.py, tests/unit/integrations/test_mt5_strategies.py, tests/unit/integrations/test_mt5_strategy_signal_contracts.py, tests/unit/integrations/test_symbol_rules.py, tests/unit/integrations/test_volatility_analyzer.py, tests/unit/integrations/test_mt5_multi_symbol_risk_contracts.py, tests/unit/integrations/test_multi_symbol_robot_coverage.py, tests/unit/live]
studies:
  - id: integrations.broker_contract_conversion
    type: code_check
    question: Do vendor data, order, position, and account values map to broker-neutral contracts without unit loss?
    source_paths: [integrations/mt5/domain/trader.py, integrations/mt5/adapters/trader.py, integrations/mt5/adapters/data.py]
    checks: [tests/unit/live/test_mt5_trader_quotes.py, tests/unit/live/test_rl_bridge.py]
    outputs: [broker_adapter_contract_check]
  - id: integrations.symbol_and_order_constraints
    type: code_check
    question: Are broker symbol, volume step, price precision, order rules, and monetary limits checked before requests?
    source_paths: [integrations/mt5/domain/multi_symbol_manager.py, integrations/mt5/domain/risk_manager.py, integrations/mt5/risk_configuration.py]
    checks: [tests/unit/live/test_risk_manager.py, tests/unit/live/test_multi_symbol_risk_stops.py]
    outputs: [broker_constraint_check]
