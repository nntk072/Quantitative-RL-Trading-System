source_scopes:
  - {path: artifacts/atomic.py, study_ids: [artifacts.identity_and_atomic_storage]}
  - {path: artifacts/identity.py, study_ids: [artifacts.identity_and_atomic_storage]}
  - {path: artifacts/layout.py, study_ids: [artifacts.identity_and_atomic_storage]}
  - {path: artifacts/retention.py, study_ids: [artifacts.identity_and_atomic_storage]}
  - {path: artifacts/contracts.py, study_ids: [artifacts.manifest_and_promotion]}
  - {path: artifacts/manifest.py, study_ids: [artifacts.manifest_and_promotion]}
  - {path: artifacts/promotion.py, study_ids: [artifacts.manifest_and_promotion]}
  - {path: artifacts/config_snapshot.py, study_ids: [artifacts.manifest_and_promotion]}
  - {path: artifacts/__init__.py, study_ids: [artifacts.identity_and_atomic_storage, artifacts.manifest_and_promotion]}
  - {path: research_tools/artifacts, study_ids: [artifacts.identity_and_atomic_storage, artifacts.manifest_and_promotion]}
config_paths: []
test_paths: [tests/unit/artifacts]
studies:
  - id: artifacts.identity_and_atomic_storage
    type: code_check
    question: Do logical identities, content hashes, and atomic writes preserve the artifact contract?
    source_paths: [artifacts/identity.py, artifacts/atomic.py, artifacts/layout.py]
    checks: [tests/unit/artifacts/test_artifact_lifecycle.py]
    outputs: [identity_and_atomic_storage_check]
  - id: artifacts.manifest_and_promotion
    type: code_check
    question: Do manifests bind artifacts to source and run identity, and does promotion require explicit lineage?
    source_paths: [artifacts/contracts.py, artifacts/manifest.py, artifacts/promotion.py]
    checks: [tests/unit/artifacts/test_artifact_promotion.py]
    outputs: [manifest_and_promotion_check]
