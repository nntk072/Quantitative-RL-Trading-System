source_scopes:
  - {path: tools/agent, study_ids: [repo_tooling.architecture_and_documentation_contracts]}
  - {path: tools/documentation, study_ids: [repo_tooling.package_cli_and_dependency_surface, repo_tooling.architecture_and_documentation_contracts]}
  - {path: tools/quality, study_ids: [repo_tooling.architecture_and_documentation_contracts]}
  - {path: scripts/research, study_ids: [repo_tooling.script_inputs_and_output_provenance]}
  - {path: scripts/compute, study_ids: [repo_tooling.script_inputs_and_output_provenance]}
  - {path: scripts/dev, study_ids: [repo_tooling.package_cli_and_dependency_surface]}
  - {path: scripts/maintenance, study_ids: [repo_tooling.script_inputs_and_output_provenance]}
  - {path: tools/quality/research_script_migration.py, study_ids: [repo_tooling.script_inputs_and_output_provenance]}
  - {path: research_tools/studies/handlers/repository.py, study_ids: [repo_tooling.script_inputs_and_output_provenance]}
  - {path: tools/research_tools, study_ids: [repo_tooling.script_inputs_and_output_provenance, repo_tooling.package_cli_and_dependency_surface, repo_tooling.architecture_and_documentation_contracts]}
config_paths: [pyproject.toml, config/studies/default.yaml, config/studies/script_migrations.yaml]
config_globs: [config/studies/profiles/*.yaml]
test_paths: [tests/unit/tooling, tests/architecture]
studies:
  - id: repo_tooling.script_inputs_and_output_provenance
    type: audit
    question: Do research and maintenance commands validate inputs, state outputs, and retain source and config provenance?
    audit_tool: repo_tooling.script_inputs_and_output_provenance
    source_paths: [scripts/research/analysis/features/build_feature_configuration_inventory.py, scripts/research/analysis/evidence/verify_result_manifest.py, tools/quality/research_script_migration.py, research_tools/studies/handlers/repository.py]
    checks: [tests/unit/research/test_feature_profile_prefix_invariance.py, tests/unit/research/test_result_manifest_verifier.py, tests/unit/tooling/test_research_script_migration.py]
    outputs: [script_contract_inventory]
  - id: repo_tooling.package_cli_and_dependency_surface
    type: code_check
    question: Do installed package contents, CLI entry points, and dependencies match the supported interface?
    source_paths: [tools/documentation/public_api.py, tools/documentation/package_dependency_model.py]
    checks: [tests/unit/tooling/test_public_api.py, tests/unit/tooling/test_documentation_inventory.py]
    outputs: [package_and_cli_check]
  - id: repo_tooling.architecture_and_documentation_contracts
    type: code_check
    question: Do package boundaries, schemas, docs, and validation routing describe the current implementation?
    source_paths: [tools/agent/validate-rules, tools/agent/validate-profiles]
    checks: [tests/architecture/test_dependency_rules.py, tests/unit/tooling/test_documentation_inventory.py]
    outputs: [architecture_and_documentation_check]
