<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
<title id="title">Feature availability follows candle close</title>
<desc id="desc">A higher-timeframe value becomes visible only after its source interval completes.</desc>
<rect width="1200" height="540" rx="24" fill="#f7f9fc"/>
<text x="60" y="72" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#17324d">Feature availability follows candle close</text>
<text x="60" y="112" font-family="Inter,Arial,sans-serif" font-size="19" fill="#496176">A higher-timeframe value becomes visible only after its source interval completes.</text>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#668097"/></marker></defs>
<line x1="319.5" y1="305.0" x2="329.5" y2="305.0" stroke="#668097" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60.0" y="210" width="256.5" height="190" rx="16" fill="#e8f1fb" stroke="#b8c8d6" stroke-width="2"/>
<text x="188.2" y="305.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="600" fill="#17324d">M1 bars</text>
<text x="188.2" y="431" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#496176">01</text>
<line x1="594.0" y1="305.0" x2="604.0" y2="305.0" stroke="#668097" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="334.5" y="210" width="256.5" height="190" rx="16" fill="#e9f5ef" stroke="#b8c8d6" stroke-width="2"/>
<text x="462.8" y="305.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="600" fill="#17324d">H1 source candle</text>
<text x="462.8" y="431" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#496176">02</text>
<line x1="868.5" y1="305.0" x2="878.5" y2="305.0" stroke="#668097" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="609.0" y="210" width="256.5" height="190" rx="16" fill="#fff3df" stroke="#b8c8d6" stroke-width="2"/>
<text x="737.2" y="305.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="600" fill="#17324d">H1 closes</text>
<text x="737.2" y="431" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#496176">03</text>
<rect x="883.5" y="210" width="256.5" height="190" rx="16" fill="#f5ebfa" stroke="#b8c8d6" stroke-width="2"/>
<text x="1011.8" y="291.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="600" fill="#17324d">Forward-fill from</text>
<text x="1011.8" y="320.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="600" fill="#17324d">close</text>
<text x="1011.8" y="431" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#496176">04</text>
</svg>
