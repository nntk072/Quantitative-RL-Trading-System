<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
<title id="title">Reproducibility levels describe evidence completeness</title>
<desc id="desc">A higher level requires more complete, independently checkable inputs and outputs.</desc>
<rect width="1200" height="540" rx="24" fill="#f7f9fc"/>
<text x="60" y="72" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#17324d">Reproducibility levels describe evidence completeness</text>
<text x="60" y="112" font-family="Inter,Arial,sans-serif" font-size="19" fill="#496176">A higher level requires more complete, independently checkable inputs and outputs.</text>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#668097"/></marker></defs>
<line x1="264.6" y1="305.0" x2="274.6" y2="305.0" stroke="#668097" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60.0" y="210" width="201.6" height="190" rx="16" fill="#e8f1fb" stroke="#b8c8d6" stroke-width="2"/>
<text x="160.8" y="305.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="600" fill="#17324d">R0: claim only</text>
<text x="160.8" y="431" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#496176">01</text>
<line x1="484.2" y1="305.0" x2="494.2" y2="305.0" stroke="#668097" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="279.6" y="210" width="201.6" height="190" rx="16" fill="#e9f5ef" stroke="#b8c8d6" stroke-width="2"/>
<text x="380.4" y="291.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="600" fill="#17324d">R1: method</text>
<text x="380.4" y="320.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="600" fill="#17324d">recorded</text>
<text x="380.4" y="431" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#496176">02</text>
<line x1="703.8" y1="305.0" x2="713.8" y2="305.0" stroke="#668097" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="499.2" y="210" width="201.6" height="190" rx="16" fill="#fff3df" stroke="#b8c8d6" stroke-width="2"/>
<text x="600.0" y="291.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="600" fill="#17324d">R2: result</text>
<text x="600.0" y="320.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="600" fill="#17324d">recomputed</text>
<text x="600.0" y="431" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#496176">03</text>
<line x1="923.4" y1="305.0" x2="933.4" y2="305.0" stroke="#668097" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="718.8" y="210" width="201.6" height="190" rx="16" fill="#f5ebfa" stroke="#b8c8d6" stroke-width="2"/>
<text x="819.6" y="291.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="600" fill="#17324d">R3: independent</text>
<text x="819.6" y="320.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="600" fill="#17324d">replay</text>
<text x="819.6" y="431" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#496176">04</text>
<rect x="938.4" y="210" width="201.6" height="190" rx="16" fill="#e8f1fb" stroke="#b8c8d6" stroke-width="2"/>
<text x="1039.2" y="291.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="600" fill="#17324d">R4: external</text>
<text x="1039.2" y="320.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="600" fill="#17324d">reproduction</text>
<text x="1039.2" y="431" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#496176">05</text>
</svg>
