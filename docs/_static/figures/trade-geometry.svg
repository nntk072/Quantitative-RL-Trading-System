<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
<title id="title">Trade geometry determines planned risk</title>
<desc id="desc">For a long position, stop distance drives size and target distance defines planned reward.</desc>
<rect width="1200" height="540" rx="24" fill="#f7f9fc"/>
<text x="60" y="72" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#17324d">Trade geometry determines planned risk</text>
<text x="60" y="112" font-family="Inter,Arial,sans-serif" font-size="19" fill="#496176">For a long position, stop distance drives size and target distance defines planned reward.</text>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#668097"/></marker></defs>
<line x1="411.0" y1="305.0" x2="421.0" y2="305.0" stroke="#668097" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60.0" y="210" width="348.0" height="190" rx="16" fill="#e8f1fb" stroke="#b8c8d6" stroke-width="2"/>
<text x="234.0" y="305.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="600" fill="#17324d">Stop</text>
<text x="234.0" y="431" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#496176">01</text>
<line x1="777.0" y1="305.0" x2="787.0" y2="305.0" stroke="#668097" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="426.0" y="210" width="348.0" height="190" rx="16" fill="#e9f5ef" stroke="#b8c8d6" stroke-width="2"/>
<text x="600.0" y="305.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="600" fill="#17324d">Entry</text>
<text x="600.0" y="431" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#496176">02</text>
<rect x="792.0" y="210" width="348.0" height="190" rx="16" fill="#fff3df" stroke="#b8c8d6" stroke-width="2"/>
<text x="966.0" y="305.0" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="600" fill="#17324d">Target</text>
<text x="966.0" y="431" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#496176">03</text>
</svg>
