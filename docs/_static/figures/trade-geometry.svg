<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Long-position stop and target distances</title>
<desc id="desc">A price ladder places the stop below entry and the target above it. The entry-to-stop distance is planned risk per unit; the entry-to-target distance is planned reward per unit.</desc>
<rect width="1200" height="640" rx="24" fill="#f7f9fc"/>
<text x="60" y="66" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#17324d">Long-position price geometry</text>
<text x="60" y="106" font-family="Inter,Arial,sans-serif" font-size="19" fill="#496176">Stop distance defines planned risk per unit; target distance defines planned reward per unit.</text>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#496176"/></marker>
  <marker id="measure" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9 z" fill="#496176"/></marker>
</defs>
<line x1="150" y1="510" x2="150" y2="185" stroke="#496176" stroke-width="3" marker-end="url(#arrow)"/>
<text x="150" y="160" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="#496176">Higher price</text>
<line x1="230" y1="225" x2="750" y2="225" stroke="#18845d" stroke-width="4"/>
<line x1="230" y1="365" x2="750" y2="365" stroke="#315a85" stroke-width="4"/>
<line x1="230" y1="505" x2="750" y2="505" stroke="#c14343" stroke-width="4"/>
<text x="250" y="210" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#126847">TARGET</text>
<text x="250" y="350" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#244769">ENTRY</text>
<text x="250" y="490" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#a12f35">STOP</text>
<line x1="680" y1="235" x2="680" y2="355" stroke="#496176" stroke-width="2.5" marker-start="url(#measure)" marker-end="url(#measure)"/>
<text x="660" y="292" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="#17324d">Target distance</text>
<line x1="680" y1="375" x2="680" y2="495" stroke="#496176" stroke-width="2.5" marker-start="url(#measure)" marker-end="url(#measure)"/>
<text x="660" y="435" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="#17324d">Stop distance</text>
<rect x="820" y="190" width="320" height="320" rx="18" fill="#ffffff" stroke="#c7d3de" stroke-width="2"/>
<text x="850" y="240" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#17324d">What the distances mean</text>
<text x="850" y="292" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600" fill="#a12f35">Entry − stop</text>
<text x="850" y="320" font-family="Inter,Arial,sans-serif" font-size="16" fill="#496176">planned risk per unit</text>
<text x="850" y="372" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600" fill="#126847">Target − entry</text>
<text x="850" y="400" font-family="Inter,Arial,sans-serif" font-size="16" fill="#496176">planned reward per unit</text>
<line x1="850" y1="425" x2="1110" y2="425" stroke="#d9e1e8" stroke-width="2"/>
<text x="850" y="460" font-family="Inter,Arial,sans-serif" font-size="15" fill="#496176">Size, instrument value, costs, and</text>
<text x="850" y="484" font-family="Inter,Arial,sans-serif" font-size="15" fill="#496176">fills determine realized amounts.</text>
</svg>
