[package]
name = "qrl-native"
version = "0.1.0"
description = "PyO3 binding for the native domain kernels; no business logic lives here"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "qrl_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["extension-module"] }
qrl-domain = { path = "../domain" }

[lints]
workspace = true
