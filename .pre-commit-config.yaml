# Runs the same ruff and mypy commands as the CI quality gate (tools/check quality).
# Install with `pre-commit install` from a development environment that has ruff and mypy on PATH.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format --check
        entry: ruff format --check
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: ruff check
        language: system
        types: [python]
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: mypy .
        language: system
        types: [python]
        pass_filenames: false
