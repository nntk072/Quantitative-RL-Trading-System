[agents]
enabled = true
# Four workers plus the root is a platform ceiling, not a target. Delegation
# policy decides whether any independent work should be spawned.
max_concurrent_threads_per_session = 4

[mcp_servers.code-review-graph]
command = "./tools/crgraph"
args = ["serve"]
cwd = "."
default_tools_approval_mode = "approve"
